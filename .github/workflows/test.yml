name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Run the same suite against both supported PostgreSQL major versions.
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Supplying this variable enables integration tests; without it they skip.
      TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # Disable cached test results and exercise Go races plus database invariants.
      - run: go test -race -count=1 -timeout=2m ./...
      - run: go build ./cmd/ledger
