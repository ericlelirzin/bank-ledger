services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-2s}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-5s}
      DB_IDLE_TX_TIMEOUT: ${DB_IDLE_TX_TIMEOUT:-5s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger-data:
